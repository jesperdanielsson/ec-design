L20 = 40

[analysis]
# EN 1992-1-1 5.1.3 anm.: rekommenderat (a) varannat fack och (b) två intilliggande fack.
# "all" (varje fack där lasten verkar ogynnsamt) täcker båda och ger aldrig lägre värden.
pattern_loading = "all"
