# Rekommenderade värden i Eurokoderna (utan nationella val), för jämförelse.

[meta]
name = "Rekommenderade värden (CEN)"
source = "EN 1990:2002, EN 1992-1-1:2004"

[concrete]
gamma_c = 1.5
gamma_s = 1.15
gamma_c_accidental = 1.2
gamma_s_accidental = 1.0
alpha_cc = 1.0
alpha_ct = 1.0

[safety_class]
# Säkerhetsklass finns inte i CEN-versionen; gamma_d = 1,0.
1 = 1.0
2 = 1.0
3 = 1.0

[combination.uls]
# EN 1990 tabell A1.2(B)
gamma_G_610a = 1.35
xi = 0.85
gamma_G_fav = 1.0
gamma_Q = 1.5
# EN 1990 A1.3.1(4): ekv. 6.10 eller 6.10a/b, nationellt val. Båda tillåts här.
methods = ["6.10", "6.10ab"]

[psi.A]
name = "Kategori A, bostäder"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.B]
name = "Kategori B, kontor"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.C]
name = "Kategori C, samlingslokaler"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.D]
name = "Kategori D, handel"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.E]
name = "Kategori E, lager"
psi0 = 1.0
psi1 = 0.9
psi2 = 0.8

[psi.F]
name = "Kategori F, fordon <= 30 kN"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.G]
name = "Kategori G, fordon 30–160 kN"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.H]
name = "Kategori H, yttertak"
psi0 = 0.0
psi1 = 0.0
psi2 = 0.0

# EN 1990 tabell A1.1: snö för platser under 1000 m ö.h. (ej Finland, Island, Norge, Sverige).
# sk_min = 0 så att samma rad gäller oavsett s_k.
[psi.snow_low]
name = "Snö, under 1000 m ö.h."
sk_min = 0.0
psi0 = 0.5
psi1 = 0.2
psi2 = 0.0

[psi.temperature]
name = "Temperatur (ej brand)"
psi0 = 0.6
psi1 = 0.5
psi2 = 0.0

[psi.wind]
name = "Vind"
psi0 = 0.6
psi1 = 0.2
psi2 = 0.0

# Nyttig last, EN 1991-1-1 tabell 6.2 (övre rekommenderade värden). Källa: "Diverse utdrag
# 2018", Chalmers BMT016, s. 23 "Appendix B: Imposed loads".
[imposed]
note = "Rekommenderade värden ur EN 1991-1-1 tabell 6.2 (kursutdrag Chalmers 2018)."

[imposed.A_floor]
name = "A – bostäder, bjälklag"
psi = "A"
qk = 2.0
Qk = 2.0

[imposed.A_stairs]
name = "A – bostäder, trappor"
psi = "A"
qk = 3.0
Qk = 2.0

[imposed.A_balcony]
name = "A – bostäder, balkonger"
psi = "A"
qk = 4.0
Qk = 2.0

[imposed.B]
name = "B – kontor"
psi = "B"
qk = 3.0
Qk = 2.0

[imposed.C1]
name = "C1 – lokaler med bord"
psi = "C"
qk = 3.0
Qk = 4.0

[imposed.C3]
name = "C3 – utan hinder för rörelse"
psi = "C"
qk = 5.0
Qk = 4.0

[imposed.D1]
name = "D1 – detaljhandel"
psi = "D"
qk = 5.0
Qk = 4.0

[imposed.E1]
name = "E – lager (minimivärde)"
psi = "E"
qk = 6.0
Qk = 7.0

[cover]
# EN 1992-1-1 4.4.1.3(1)P och 4.4.1.2(6)–(8): rekommenderade värden.
delta_c_dev = 10
delta_c_dur_gamma = 0
delta_c_dur_st = 0
delta_c_dur_add = 0
binders.pc80 = "Alla bindemedel"
binders.pc_lt80 = "Alla bindemedel"

# c_min,dur (mm): EN 1992-1-1 tabell 4.4N, armering. L50 = konstruktionsklass S4
# (rekommenderad för 50 år), L100 = S6 (S4 + 2 klasser för 100 år, tabell 4.3N).
# L20 saknas i CEN-versionen; S3 (S4 - 1 klass) används som närmevärde. OSÄKER: L20.
# vct_max: EN 206 bilaga F (informativ, rekommenderade gränsvärden).
[[cover.cmin_dur]]
classes = ["X0"]
binder = "alla"
vct_max = 2.0
L100 = 20
L50 = 10
L20 = 10

[[cover.cmin_dur]]
classes = ["XC1"]
binder = "alla"
vct_max = 0.65
L100 = 25
L50 = 15
L20 = 10

[[cover.cmin_dur]]
classes = ["XC2"]
binder = "alla"
vct_max = 0.60
L100 = 35
L50 = 25
L20 = 20

[[cover.cmin_dur]]
classes = ["XC3"]
binder = "alla"
vct_max = 0.55
L100 = 35
L50 = 25
L20 = 20

[[cover.cmin_dur]]
classes = ["XC4"]
binder = "alla"
vct_max = 0.50
L100 = 40
L50 = 30
L20 = 25

[[cover.cmin_dur]]
classes = ["XD1"]
binder = "alla"
vct_max = 0.55
L100 = 45
L50 = 35
L20 = 30

[[cover.cmin_dur]]
classes = ["XS1"]
binder = "alla"
vct_max = 0.50
