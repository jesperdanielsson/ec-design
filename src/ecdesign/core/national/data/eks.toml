# Svenska nationella val. Varje värde har en källa i kommentaren.
# Granskade och godkända av Jesper 2026-11-21.
# Boverket ersätter EKS stegvis med nya föreskrifter; uppdatera denna fil då.

[meta]
name = "Sverige (EKS)"
source = "Boverkets EKS 11, BFS 2011:10 i lydelse BFS 2019:1"

[concrete]
# EN 1992-1-1 2.4.2.4, tabell 2.1N. EKS: rekommenderade värden.
gamma_c = 1.5
gamma_s = 1.15
gamma_c_accidental = 1.2
gamma_s_accidental = 1.0
# EN 1992-1-1 3.1.6(1)P. EKS: alpha_cc = alpha_ct = 1,0.
alpha_cc = 1.0
alpha_ct = 1.0

[safety_class]
# EKS avd. A (säkerhetsklasser): partialkoefficient gamma_d.
1 = 0.83
2 = 0.91
3 = 1.0

[combination.uls]
# EKS avd. B (EN 1990 bilaga A1): ekv. 6.10a och 6.10b, ogynnsam permanent last.
gamma_G_610a = 1.35
xi = 0.89          # 1,2 / 1,35, ekv. 6.10b
gamma_G_fav = 1.0
gamma_Q = 1.5
# EKS avd. B: kombinationsregler i brottgräns (STR/GEO). EKS tillåter 6.10a/b.
# OGRANSKAT: tillagt i laststeget. EKS avd. A: gamma_d multipliceras på ogynnsamma laster i
# brottgräns; gynnsam permanent last tas med 1,0 utan gamma_d.
methods = ["6.10ab"]

# EKS avd. B (EN 1990 bilaga A1): psi-faktorer.
[psi.A]
name = "Kategori A, bostäder"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.B]
name = "Kategori B, kontor"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.C]
name = "Kategori C, samlingslokaler"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.D]
name = "Kategori D, handel"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.E]
name = "Kategori E, lager"
psi0 = 1.0
psi1 = 0.9
psi2 = 0.8

# Snö: sk_min = lägsta s_k (kN/m²) för raden. Gränserna står i radernas namn i EKS
# tabell B-1 (samma tabell som psi-värdena ovan).
[psi.snow_high]
name = "Snö, s_k >= 3 kN/m²"
sk_min = 3.0
psi0 = 0.8
psi1 = 0.6
psi2 = 0.2

[psi.snow_mid]
name = "Snö, 2 <= s_k < 3 kN/m²"
sk_min = 2.0
psi0 = 0.7
psi1 = 0.4
psi2 = 0.2

[psi.snow_low]
name = "Snö, 1 <= s_k < 2 kN/m²"
sk_min = 1.0
psi0 = 0.6
psi1 = 0.3
psi2 = 0.1

[psi.wind]
name = "Vind"
psi0 = 0.3
psi1 = 0.2
psi2 = 0.0

# --- Tillägg i laststeget 2026-11-21 ------------------------------------------------
# OGRANSKAT: ψ för kategori F, G, H och temperatur, tillagda i laststeget.
# OSÄKER: antas lika med EN 1990 tabell A1.1 (rekommenderat); kontrollera EKS tabell B-1.
[psi.F]
name = "Kategori F, fordon <= 30 kN"
psi0 = 0.7
psi1 = 0.7
psi2 = 0.6

[psi.G]
name = "Kategori G, fordon 30–160 kN"
psi0 = 0.7
psi1 = 0.5
psi2 = 0.3

[psi.H]
name = "Kategori H, yttertak"
psi0 = 0.0
psi1 = 0.0
psi2 = 0.0

[psi.temperature]
name = "Temperatur (ej brand)"
psi0 = 0.6
psi1 = 0.5
psi2 = 0.0

# Nyttig last, utbredd q_k (kN/m²) och koncentrerad Q_k (kN), EN 1991-1-1 6.3.1.2 tabell 6.2.
# Används bara som förslag i gränssnittet; konstruktören anger alltid lasten själv.
# OGRANSKAT och OSÄKER: värdena är inte kontrollerade mot EKS avd. B (EN 1991-1-1
# kap. 6.3.1.2). Jämför med EKS innan de används.
[imposed]
note = "OSÄKER: förslagen är inte kontrollerade mot EKS avd. B. Kontrollera innan användning."

[imposed.A_floor]
name = "A – bostäder, bjälklag"
psi = "A"
qk = 2.0
Qk = 2.0

[imposed.A_stairs]
name = "A – bostäder, trappor"
psi = "A"
qk = 2.0
Qk = 2.0

[imposed.A_balcony]
name = "A – bostäder, balkonger"
psi = "A"
qk = 3.5
Qk = 2.0

[imposed.B]
name = "B – kontor"
psi = "B"
qk = 2.5
Qk = 3.0

[imposed.C1]
name = "C1 – lokaler med bord (skolor, kaféer)"
psi = "C"
qk = 2.5
Qk = 3.0

[imposed.C2]
name = "C2 – fasta sittplatser (kyrkor, teatrar)"
psi = "C"
qk = 3.0
Qk = 4.0

[imposed.C3]
name = "C3 – utan hinder för rörelse (museer, entréer)"
psi = "C"
qk = 3.0
Qk = 4.0

[imposed.C4]
name = "C4 – fysisk aktivitet (gymnastiksalar, scener)"
psi = "C"
qk = 4.0
Qk = 7.0

[imposed.C5]
name = "C5 – stora folksamlingar (konserthallar, läktare)"
psi = "C"
qk = 5.0
Qk = 4.5

[imposed.D1]
name = "D1 – detaljhandel"
psi = "D"
qk = 4.0
Qk = 4.0

[imposed.D2]
name = "D2 – varuhus"
psi = "D"
qk = 5.0
Qk = 7.0

[imposed.E1]
name = "E1 – lager (minimivärde)"
psi = "E"
qk = 7.5
Qk = 7.0

# --- Täckande betongskikt och vct (EN 1992-1-1 4.4.1) ---------------------------
# OGRANSKAT: tillagt 2026-11-21 i materialsteget, ska granskas av Jesper.
[cover]
# EN 1992-1-1 4.4.1.3(1)P: tillåten måttavvikelse. Rekommenderat värde 10 mm.
# OSÄKER: EKS antas följa rekommenderat värde; kontrollera EKS avd. D.
delta_c_dev = 10
# EN 1992-1-1 4.4.1.2(6)–(8): tillägg/avdrag i ekv. (4.2). Rekommenderat 0 mm.
# OSÄKER: EKS antas följa rekommenderade värden.
delta_c_dur_gamma = 0
delta_c_dur_st = 0
delta_c_dur_add = 0
# Bindemedelsgrupper i tabell D-1.
binders.pc80 = "Minst 80 % portlandcementklinker (t.ex. CEM I, CEM II/A)"
binders.pc_lt80 = "Mindre än 80 % portlandcementklinker"

# EN 1992-1-1 4.4.1.2(5): c_min,dur (mm) för armering med diameter >= 4 mm som inte är
# spännarmering. Källa: EKS tabell D-1 "Minsta täckande betongskikt, c_min,dur, med
# hänsyn till beständighet för armering", BFS 2011:10 avd. D kap. 2.1.1 § 10 i lydelse
# BFS 2022:4 (EKS 12), s. 2. vct_max = högsta ekvivalenta vct för raden.
# OSÄKER: radindelningen är tolkad ur PDF:ens textlager; jämför med tabellen i PDF:en.
# Fotnoter: XS2/XS3 gäller kloridhalt i havet <= 0,4 % (ostkusten). Annat bindemedel än
# PC, flygaska, slagg, silika eller kalksten, eller > 20 % kalksten, kan ge lägre vct.
# Armering < 4 mm och spännarmering: +10 mm (ej inlagt än). XA1–XA3 och XF: bedöms särskilt.
# X0: "-" i tabellen, dvs. inget beständighetskrav (c_min >= 10 mm gäller ändå).
[[cover.cmin_dur]]
classes = ["X0"]
binder = "alla"
vct_max = 2.0
L100 = 0
L50 = 0
L20 = 0

